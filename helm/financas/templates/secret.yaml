{{- if not .Values.existingSecret.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "financas.secretName" . }}
  labels:
    {{- include "financas.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "Informe secrets.databaseUrl ou existingSecret.name" .Values.secrets.databaseUrl | quote }}
  JWT_SECRET: {{ required "Informe secrets.jwtSecret ou existingSecret.name" .Values.secrets.jwtSecret | quote }}
  POSTGRES_PASSWORD: {{ required "Informe secrets.postgresqlPassword ou existingSecret.name" .Values.secrets.postgresqlPassword | quote }}
{{- end }}
